[project]
name = "vox-cli"
version = "0.2.1"
description = "Local transcription (Whisper) and speech (Kokoro) for Apple Silicon Macs and Linux. No cloud, no idle memory."
readme = "README.md"
authors = [{ name = "Destiny Ezenwata" }]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # CLI
    "typer>=0.12",
    "httpx>=0.27",
    # Server
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # Models
    "huggingface_hub>=1.0",
    "numpy>=1.26",
    # Kokoro's text front end, on every platform: misaki[en] minus
    # spacy-curated-transformers, which is only for misaki's transformer mode
    # and makes spaCy import torch.
    "misaki>=0.9.4,<0.10",
    "spacy>=3.8,<3.9",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    # Apple Silicon engines (MLX)
    "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.5.8,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Linux engines (CTranslate2 and ONNX Runtime, CPU or NVIDIA GPU)
    "faster-whisper>=1.1,<2; sys_platform == 'linux'",
    "onnxruntime>=1.18; sys_platform == 'linux'",
]

[project.optional-dependencies]
# The Linux engines on any platform, for example to try them on a Mac.
portable = ["faster-whisper>=1.1,<2", "onnxruntime>=1.18"]

[project.scripts]
vox = "vox.cli:main"

[dependency-groups]
dev = ["pytest>=8", "faster-whisper>=1.1,<2", "onnxruntime>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real models installed (skipped otherwise)"]
