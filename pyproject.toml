[project]
name = "vox-cli"
version = "0.1.0"
description = "Local transcription (Whisper) and speech (Kokoro) for Apple Silicon Macs. No cloud, no idle memory."
readme = "README.md"
authors = [{ name = "Destiny Ezenwata" }]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # CLI
    "typer>=0.12",
    "httpx>=0.27",
    # Server
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # Models and engines
    "huggingface_hub>=1.0",
    "numpy>=1.26",
    "mlx-whisper>=0.4.3,<0.5",
    "mlx-audio>=0.5.8,<0.6",
    # Kokoro's English text front end: misaki[en] minus spacy-curated-transformers,
    # which is only for misaki's transformer mode and makes spaCy import torch.
    "misaki>=0.9.4,<0.10",
    "spacy>=3.8,<3.9",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
]

[project.scripts]
vox = "vox.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real models installed (skipped otherwise)"]
