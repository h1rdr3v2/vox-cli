# vox model catalog. Curated models that `vox models pull <id>` knows by name.
# Any other model on Hugging Face can be pulled as hf:<org>/<repo> --type stt|tts.
#
# Each model has one id and a download source per engine family:
#   mlx       Apple Silicon (mlx-whisper, mlx-audio)
#   portable  Linux (faster-whisper, Kokoro on ONNX Runtime)
# A source has: engine, repo (Hugging Face), size_mb (approximate download),
# and optionally revision. Model fields: id, type (stt|tts), note, languages,
# and optionally recommended and default_voice.

version = 2

[[model]]
id = "whisper-tiny"
type = "stt"
languages = "99 languages, auto-detected"
note = "fastest, lowest accuracy"
mlx = { engine = "mlx-whisper", repo = "mlx-community/whisper-tiny-mlx", size_mb = 74 }
portable = { engine = "faster-whisper", repo = "Systran/faster-whisper-tiny", size_mb = 78 }

[[model]]
id = "whisper-base"
type = "stt"
languages = "99 languages, auto-detected"
note = "fast, fair accuracy"
mlx = { engine = "mlx-whisper", repo = "mlx-community/whisper-base-mlx", size_mb = 144 }
portable = { engine = "faster-whisper", repo = "Systran/faster-whisper-base", size_mb = 148 }

[[model]]
id = "whisper-small"
type = "stt"
languages = "99 languages, auto-detected"
note = "balanced speed and accuracy"
mlx = { engine = "mlx-whisper", repo = "mlx-community/whisper-small-mlx", size_mb = 481 }
portable = { engine = "faster-whisper", repo = "Systran/faster-whisper-small", size_mb = 486 }

[[model]]
id = "whisper-medium"
type = "stt"
languages = "99 languages, auto-detected"
note = "accurate, slower"
mlx = { engine = "mlx-whisper", repo = "mlx-community/whisper-medium-mlx", size_mb = 1525 }
portable = { engine = "faster-whisper", repo = "Systran/faster-whisper-medium", size_mb = 1531 }

[[model]]
id = "whisper-large-v3-turbo"
type = "stt"
languages = "99 languages, auto-detected"
note = "recommended: near large-v3 accuracy, much faster"
recommended = true
mlx = { engine = "mlx-whisper", repo = "mlx-community/whisper-large-v3-turbo", size_mb = 1614 }
portable = { engine = "faster-whisper", repo = "mobiuslabsgmbh/faster-whisper-large-v3-turbo", size_mb = 1622 }

[[model]]
id = "whisper-large-v3"
type = "stt"
languages = "99 languages, auto-detected"
note = "most accurate, slowest"
mlx = { engine = "mlx-whisper", repo = "mlx-community/whisper-large-v3-mlx", size_mb = 3084 }
portable = { engine = "faster-whisper", repo = "Systran/faster-whisper-large-v3", size_mb = 3091 }

[[model]]
id = "kokoro-82m"
type = "tts"
languages = "English (US, UK), Spanish, French, Hindi, Italian, Brazilian Portuguese"
note = "recommended TTS; best in English"
recommended = true
default_voice = "af_heart"
mlx = { engine = "kokoro", repo = "mlx-community/Kokoro-82M-bf16", size_mb = 370 }
portable = { engine = "kokoro-onnx", repo = "onnx-community/Kokoro-82M-v1.0-ONNX", size_mb = 370 }
